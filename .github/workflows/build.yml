name: build-assemblies
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [mvp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages for headless OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 fonts-liberation fonts-dejavu-core
      - name: CadQuery
        run: pip install -q cadquery
      - name: Build ${{ matrix.target }}
        run: |
          mkdir -p out/renders
          xvfb-run -a -s "-screen 0 1920x1440x24" python -u build_${{ matrix.target }}.py 2>&1 | tee out/${{ matrix.target }}_run.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/
